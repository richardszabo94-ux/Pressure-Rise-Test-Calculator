name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Build Project from Scratch
        run: |
          # 1. Hozunk létre egy tiszta, natív Androidos Flutter projektet
          flutter create --org com.ndt --project-name pressure_rise_calc app_build
          cd app_build

          # 2. Másoljuk be a fő alkalmazáskódot a repository-ból
          cp ../lib/main.dart lib/main.dart

          # 3. Ikonok előkészítése és generálása
          if [ -f "../app_icon.png" ]; then
            cp ../app_icon.png app_icon.png
            flutter pub add flutter_launcher_icons --dev
            cat << 'EOF' > flutter_launcher_icons.yaml
          flutter_launcher_icons:
            android: "launcher_icon"
            ios: false
            image_path: "app_icon.png"
            min_sdk_android: 21
          EOF
            dart run flutter_launcher_icons
          fi

          # 4. APK fordítása
          flutter build apk --debug

          # 5. Kész APK kimásolása
          mkdir -p ../output
          cp build/app/outputs/flutter-apk/app-debug.apk ../output/PressureRiseCalc.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: PressureRiseCalc-APK
          path: output/PressureRiseCalc.apk
