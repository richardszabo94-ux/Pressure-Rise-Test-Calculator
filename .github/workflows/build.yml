name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install ImageMagick (Icon Resizer)
        run: sudo apt-get update && sudo apt-get install -y imagemagick

      - name: Assemble Native Project & Replace Icons
        run: |
          # 1. Tiszta Flutter projekt létrehozása
          flutter create --org com.ndt --project-name pressure_rise_calc app_build
          cd app_build

          # 2. Alkalmazás nevének átírása a telefon kezdőképernyőjéhez
          sed -i 's/android:label="pressure_rise_calc"/android:label="Kalkulátor - Nyomásváltásos"/' android/app/src/main/AndroidManifest.xml

          # 3. Forráskód és beállítások bemásolása
          cp ../lib/main.dart lib/main.dart
          cp ../pubspec.yaml pubspec.yaml

          # 4. Képfájl megkeresése (akár icon.png, akár app_icon.png)
          ICON_FILE=""
          if [ -f "../icon.png" ]; then
            ICON_FILE="../icon.png"
          elif [ -f "../app_icon.png" ]; then
            ICON_FILE="../app_icon.png"
          fi

          # 5. KÖZVETLEN IKON BEÉGETÉS (sima és kerekített formában is)
          if [ -n "$ICON_FILE" ]; then
            echo "Egyedi ikon megtalálva ($ICON_FILE), konvertálás indul..."
            
            # Töröljük a Flutter alapértelmezett adaptív XML-jét, ami a kék madarat kényszerítené ki
            rm -rf android/app/src/main/res/mipmap-anydpi-v26

            # Méretezés az összes hivatalos Android felbontásra:
            for res in "mdpi:48" "hdpi:72" "xhdpi:96" "xxhdpi:144" "xxxhdpi:192"; do
              folder="android/app/src/main/res/mipmap-${res%%:*}"
              size="${res##*:}"
              convert "$ICON_FILE" -resize ${size}x${size} "$folder/ic_launcher.png"
              convert "$ICON_FILE" -resize ${size}x${size} "$folder/ic_launcher_round.png"
            done
          else
            echo "FIGYELEM: Nem található icon.png vagy app_icon.png a gyökérkönyvtárban!"
          fi

          # 6. Függőségek letöltése
          flutter pub get

          # 7. RELEASE APK fordítás (~18 MB méret)
          flutter build apk --release

          # 8. Kész APK kimásolása
          mkdir -p ../output
          cp build/app/outputs/flutter-apk/app-release.apk ../output/PressureRiseCalc.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: PressureRiseCalc-APK
          path: output/PressureRiseCalc.apk
