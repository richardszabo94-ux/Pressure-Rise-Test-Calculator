name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Assemble & Inject Launcher Icon
        run: |
          # 1. Tiszta Android projekt inicializálása
          flutter create --org com.ndt --project-name pressure_rise_calc app_build
          cd app_build

          # 2. Forráskód és beállítások átvitele
          cp ../lib/main.dart lib/main.dart
          cp ../pubspec.yaml pubspec.yaml

          # 3. Kép bemásolása és a hivatalos launcher ikon generálás
          if [ -f "../app_icon.png" ]; then
            cp ../app_icon.png assets_icon.png
            flutter pub add flutter_launcher_icons --dev
            cat << 'EOF' > flutter_launcher_icons.yaml
          flutter_launcher_icons:
            android: true
            ios: false
            image_path: "assets_icon.png"
            min_sdk_android: 21
            adaptive_icon_background: "#1565C0"
            adaptive_icon_foreground: "assets_icon.png"
          EOF
            dart run flutter_launcher_icons
          fi

          # 4. Függőségek és Debug APK fordítás
          flutter pub get
          flutter build apk --debug

          # 5. Csomagolás exportálásra
          mkdir -p ../output
          cp build/app/outputs/flutter-apk/app-debug.apk ../output/PressureRiseCalc.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: PressureRiseCalc-APK
          path: output/PressureRiseCalc.apk
